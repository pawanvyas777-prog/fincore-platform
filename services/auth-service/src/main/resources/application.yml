spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fincore
    username: postgres
    password: postgres

  flyway:
    schemas: auth
    default-schema: auth
    table: flyway_schema_history

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info"